<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Compass AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div>
    <h2>Career Compass AI</h2>
    <div class="menu">
      <button onclick="sendPredefinedMessage('career chat')">Career Chat</button>
      <button onclick="sendPredefinedMessage('resume')">Resume Builder</button>
      <button onclick="sendPredefinedMessage('job search')">Job Search</button>
      <button onclick="sendPredefinedMessage('interview')">Interview Prep</button>
      <button onclick="sendPredefinedMessage('skills')">Career Tips</button>
    </div>
  </div>
  <div class="status">✅ CONNECTED — Career AI engine active</div>
</div>

<!-- Chat Area -->
<div class="chat-container">
  <div class="header">
    <h2>Career Compass AI Command Center</h2>
    <p>AI-powered career guidance & job search suite</p>
  </div>

  <div id="messages">
    <div class="welcome-card">
      <h3>👋 Welcome to Career Compass AI</h3>
      <p>Ask career questions, paste your resume, or explore tools using the sidebar.</p>
      <div class="quick-buttons">
        <button onclick="sendPredefinedMessage('data scientist')">How do I switch careers?</button>
        <button onclick="sendPredefinedMessage('resume')">Can you review my resume?</button>
        <button onclick="sendPredefinedMessage('job search')">Help me find job openings.</button>
        <button onclick="sendPredefinedMessage('interview')">Give me interview tips.</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask your career question...">
    <button class="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
function sendPredefinedMessage(message){
    document.getElementById("userInput").value = message;
    sendMessage();
}

function sendMessage(){
    let userInput = document.getElementById("userInput").value;
    if(userInput.trim() === "") return;

    let messages = document.getElementById("messages");
    messages.innerHTML += `<div class="message user">${userInput}</div>`;

    fetch("/get", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "message=" + encodeURIComponent(userInput)
    })
    .then(response => response.json())
    .then(data => {
        messages.innerHTML += `<div class="message bot">${data.response.replace(/\n/g,"<br>")}</div>`;
        messages.scrollTop = messages.scrollHeight;
    });

    document.getElementById("userInput").value = "";
}
</script>

</body>
</html>
